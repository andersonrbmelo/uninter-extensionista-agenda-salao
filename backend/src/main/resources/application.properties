spring.application.name=salon-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salon_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:senha_secreta}
spring.jpa.hibernate.ddl-auto=update

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:dev-only-change-me-salon-jwt-secret-key-32bytes-min}
jwt.expiration-ms=604800000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://192.168.1.110:4200}
app.registration-enabled=false
app.admin.email=${ADMIN_EMAIL:admin@salon.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.seed.demo-data=${SEED_DEMO_DATA:true}
app.timezone=${APP_TIMEZONE:America/Recife}